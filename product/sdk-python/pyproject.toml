[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sixteen-memory"
version = "0.3.1"
description = "Explicit, source-linked, user-scoped client for the SixteenMemory API."
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["sixteen-memory", "agent-memory", "ai-agents", "context-engineering", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://www.sixteenmemory.com"
Documentation = "https://github.com/Sixteen-Memory/sixteen-memory/blob/main/product/sdk-python/README.md"
Repository = "https://github.com/Sixteen-Memory/sixteen-memory"
Issues = "https://github.com/Sixteen-Memory/sixteen-memory/issues"

[project.optional-dependencies]
async = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["sixteen_memory"]

[tool.setuptools.package-data]
sixteen_memory = ["py.typed"]
