[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sixteen-memory"
version = "0.3.1"
description = "Explicit, scoped client for the SixteenMemory API."
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
async = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["sixteen_memory"]

[tool.setuptools.package-data]
sixteen_memory = ["py.typed"]
