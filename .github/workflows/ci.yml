name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Docs, SDKs, Worker & Website
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline documentation and SVG checks
        run: npm run check:docs

      - name: Install workspace dependencies
        run: npm run setup

      - name: Build and verify Python SDK
        run: |
          python -m pip install --upgrade pip build
          python -m build product/sdk-python
          python product/sdk-python/test_package.py
          python -m unittest discover -s product/sdk-python -p "test_client.py" -v

      - name: OpenAPI schema and TypeScript SDK checks
        run: npm run check:api

      - name: Build product (TypeScript, Console, Worker dry-run)
        run: npm run build:product

      - name: Product unit and runtime suites
        run: |
          npm run check:product
          npm --prefix product run test:wiki
          npm --prefix product run test:agent-access
          npm --prefix product run test:oauth

      - name: Run zero-key incremental Wiki and MCP demo
        run: npm run demo

      - name: Vercel AI SDK adapter tests
        run: npm run check:vercel-ai

      - name: Website tests and static build
        run: npm run check:website
